# Texty (name/description) jsou v strings.json a translations/*.json — tady jen selektory.
search:
  fields:
    query:
      required: true
      example: Matrix
      selector:
        text: null
    type:
      default: movie
      selector:
        select:
          options:
          - movie
          - series
          - webshare
          - catalog
          - catalog_series
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 60
